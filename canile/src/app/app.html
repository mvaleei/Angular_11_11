<table border="1">
  <tr>
    <td><label for="">Nome del cane</label></td>
    <td>
      <input type="text" [(ngModel)]="nome"> <span>{{nome}}</span>
    </td>
    <td><label for="">Razza del cane</label></td>
    <td>
      <select name="" id="" [(ngModel)]="razzaScelta">

        @for (item of tipo; track $index) {
        <option value="{{item.id}}">{{item.descrizione}}</option>
        }

      </select> <span>{{razzaScelta}}</span>
    </td>
  </tr>
  <tr>
    <td><label for="">Anni del cane</label></td>
    <td>
      <input type="number" [(ngModel)]="anni"> <span>{{anni}}</span>
    </td>
    <td><label for="">Box di inserimento</label></td>
    <td>
      <input type="number" [(ngModel)]="box"> <span>{{box}}</span>
    </td>
  </tr>
  <tr colspan="4">
    <td>
      <button (click)="addDog()">Aggiungi cane nel canile</button>
    </td>
    <td>
      <h4>Media degli anni: {{media}}</h4>
    </td>

  </tr>
</table>

<table border="4">

  @for (dog of canileArchivio; track $index) {
  <tr>
    <td><label for="">{{dog.idDog}}</label></td>
    <td><label for="">{{dog.nome}}</label></td>
    <td><label for="">{{dog.anni}}</label></td>
    <td><label for="">{{dog.box}}</label></td>
    <td><label for="">{{dog.razza.descrizione}}</label></td>
    <td><label for="">{{dog.razza.aggressivita}}</label></td>
  </tr>
  }


</table>
